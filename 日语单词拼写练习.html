<title>かな練習 · 标日初级上册单词拼写</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EEF1EE;
  --panel:#FFFFFF;
  --ink:#23282B;
  --muted:#6E7A76;
  --ai:#33518E;
  --ai-deep:#26406F;
  --ai-soft:#DFE6F2;
  --shu:#BE4441;
  --shu-soft:#F6E3E2;
  --midori:#3F7D57;
  --midori-soft:#E1EFE6;
  --line:#D7DDD8;
  --masu-line:#E4E1D6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px;
  line-height:1.6;
  min-height:100vh;
}
.jp{font-family:"Shippori Mincho","Yu Mincho","MS Mincho",serif;}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 64px;}
header.top{
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px;
}
header.top h1{font-size:20px;font-weight:700;letter-spacing:.02em;}
header.top .sub{font-size:12px;color:var(--muted);}
main section{margin-top:28px;}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;}

/* ---------- setup ---------- */
.sec-label{font-size:13px;font-weight:700;color:var(--ai);letter-spacing:.14em;margin-bottom:10px;}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.chip{
  border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:7px 4px 5px;text-align:center;cursor:pointer;user-select:none;
  transition:border-color .12s, background .12s;
}
.chip .no{display:block;font-weight:700;font-size:15px;}
.chip .ct{display:block;font-size:11px;color:var(--muted);line-height:1.3;}
.chip:hover{border-color:var(--ai);}
.chip.on{background:var(--ai);border-color:var(--ai);color:#fff;}
.chip.on .ct{color:#C9D4E8;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;}
button{font:inherit;cursor:pointer;}
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:6px;padding:7px 14px;font-size:14px;
  transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--ai);color:var(--ai);}
.btn.wrongbook{color:var(--shu);border-color:#E7C9C7;}
.btn.wrongbook:hover{border-color:var(--shu);}
.opt{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:14px;color:var(--muted);}
.opt label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.opt input{accent-color:var(--ai);width:15px;height:15px;}
.start{
  width:100%;margin-top:22px;padding:13px;border:none;border-radius:8px;
  background:var(--ai);color:#fff;font-size:16px;font-weight:700;letter-spacing:.08em;
  transition:background .12s;
}
.start:hover{background:var(--ai-deep);}
.start:disabled{background:#A8B2C4;cursor:not-allowed;}

/* ---------- drill ---------- */
.drill-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:12px;}
.drill-top .quit{border:none;background:none;color:var(--muted);font-size:13px;padding:4px 2px;}
.drill-top .quit:hover{color:var(--shu);}
.streak{font-variant-numeric:tabular-nums;}
.streak b{color:var(--midori);font-size:15px;}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:28px 26px 24px;position:relative;
}
.card .tags{position:absolute;top:-11px;left:20px;display:flex;gap:6px;}
.tag{
  font-size:11px;padding:1px 9px;border-radius:99px;background:var(--ink);color:#fff;letter-spacing:.06em;
}
.tag.pos{background:var(--ai);}
.tag.lesson{background:#8B917F;}
.meaning{font-size:26px;font-weight:700;line-height:1.45;min-height:44px;}
.kanji-hint{font-size:15px;color:var(--muted);margin-top:2px;}

.masu{
  display:flex;flex-wrap:wrap;gap:6px;margin:22px 0 4px;
}
.masu .cell{
  width:52px;height:52px;border:1.5px solid var(--masu-line);background:#FDFCF9;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;color:var(--ink);
  border-radius:2px;
}
.masu .cell.filled{border-color:#B9C4B0;}
.masu.ok .cell{background:var(--midori-soft);border-color:var(--midori);color:var(--midori);}
.masu.bad .cell{background:var(--shu-soft);border-color:var(--shu);color:var(--shu);}
.masu.bad .cell.hit{background:var(--midori-soft);border-color:var(--midori);color:var(--midori);}

#ans{
  width:100%;margin-top:10px;padding:10px 12px;font-size:18px;
  border:1.5px solid var(--line);border-radius:6px;background:var(--panel);
  font-family:inherit;color:var(--ink);outline:none;
}
#ans:focus{border-color:var(--ai);}
.actions{display:flex;gap:8px;margin-top:12px;}
.actions .btn{font-size:13px;padding:6px 12px;}
.feedback{margin-top:16px;min-height:30px;}
.fb-msg{font-size:14px;font-weight:700;}
.fb-msg.ok{color:var(--midori);}
.fb-msg.bad{color:var(--shu);}
.reveal{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:8px;
  padding-top:12px;border-top:1px dashed var(--line);
}
.reveal .kana{font-size:22px;font-weight:800;color:var(--ai);}
.reveal .kanji{font-size:16px;color:var(--ink);}
.reveal .say{
  border:1px solid var(--line);background:var(--panel);border-radius:99px;
  width:34px;height:34px;font-size:16px;line-height:1;align-self:center;
}
.reveal .say:hover{border-color:var(--ai);}
.enter-tip{font-size:12px;color:var(--muted);margin-top:8px;}

/* ---------- result ---------- */
.score{display:flex;gap:34px;align-items:baseline;padding:18px 4px;}
.score .num{font-size:46px;font-weight:800;line-height:1;}
.score .num.ok{color:var(--midori);}
.score .lab{font-size:13px;color:var(--muted);margin-top:6px;}
.wrong-list{margin-top:8px;}
.wrong-list h3{font-size:14px;color:var(--shu);letter-spacing:.1em;margin-bottom:8px;}
.wrow{
  display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
  padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px;
}
.wrow .l{font-size:11px;color:var(--muted);min-width:44px;}
.wrow .k{font-weight:800;min-width:120px;}
.wrow .m{color:var(--muted);font-size:13px;}
.empty-note{color:var(--muted);font-size:14px;padding:10px 4px;}
@media (max-width:480px){
  .masu .cell{width:44px;height:44px;font-size:22px;}
  .meaning{font-size:21px;}
  .score{gap:22px;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="jp">かな書き取り <span style="font-family:inherit">· 单词拼写练习</span></h1>
    <div class="sub">新版标准日本语 初级上册 · 1065 词</div>
  </header>

  <!-- ============ 选择范围 ============ -->
  <section id="setup">
    <div class="sec-label">选择课文范围</div>
    <div class="lessons" id="lessonChips"></div>
    <div class="row">
      <button class="btn" id="allBtn">全选</button>
      <button class="btn" id="noneBtn">清空</button>
      <button class="btn wrongbook" id="wrongBtn">只练错题本（0）</button>
    </div>
    <div class="opt">
      <label><input type="checkbox" id="optRandom" checked>乱序出题</label>
      <label><input type="checkbox" id="optKanji">题面显示汉字写法</label>
      <label><input type="checkbox" id="optLen" checked>显示字数格子</label>
    </div>
    <p class="note">看中文释义，用日语输入法把这个词的假名拼出来，回车判定。答错的词会自动进错题本。</p>
    <button class="start" id="startBtn" disabled>请先选择课文</button>
  </section>

  <!-- ============ 练习 ============ -->
  <section id="drill" hidden>
    <div class="drill-top">
      <button class="quit" id="quitBtn">← 退出</button>
      <div id="progress"></div>
      <div class="streak">连对 <b id="streakNum">0</b></div>
    </div>
    <div class="card">
      <div class="tags">
        <span class="tag pos" id="posTag"></span>
        <span class="tag lesson" id="lessonTag"></span>
      </div>
      <div class="meaning jp" id="meaningEl"></div>
      <div class="kanji-hint jp" id="kanjiHint" hidden></div>
      <div class="masu jp" id="masu"></div>
      <input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入假名，回车判定">
      <div class="actions">
        <button class="btn" id="hintBtn">提示下一假名</button>
        <button class="btn" id="clearBtn">清空</button>
        <button class="btn" id="skipBtn">跳过（记为答错）</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>

  <!-- ============ 结果 ============ -->
  <section id="result" hidden>
    <div class="score">
      <div><div class="num ok" id="scoreCorrect">0</div><div class="lab">答对</div></div>
      <div><div class="num" id="scoreTotal">0</div><div class="lab">总题数</div></div>
      <div><div class="num" id="scoreStreak">0</div><div class="lab">最高连对</div></div>
    </div>
    <div class="wrong-list" id="wrongListBlock" hidden>
      <h3>本次答错</h3>
      <div id="wrongRows"></div>
    </div>
    <p class="empty-note" id="allRightNote" hidden>全部答对，漂亮！</p>
    <div class="row">
      <button class="btn" id="redoWrongBtn">重练本次错题</button>
      <button class="btn" id="redoSameBtn">同范围再来一轮</button>
      <button class="btn" id="backBtn">返回选择</button>
    </div>
  </section>
</div>

DATA.lessons.forEach(L => L.words.forEach(w => { w.lesson = L.lesson; }));
const LS_KEY = "biaori1_kana_v1";

/* ---------- 存档 ---------- */
function loadStore(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && s.wrong) return s; }catch(e){}
  return { wrong: [], stats: {} };
}
const store = loadStore();
function saveStore(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
const wkey = w => "l" + w.lesson + ":" + w.kana;

/* ---------- 工具 ---------- */
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function kataToHira(s){
  return s.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
function norm(s){
  return kataToHira(s.replace(/[～~・∕/／\s（）()！!？?。、,，]/g, ""));
}
const $ = id => document.getElementById(id);

/* ---------- 范围选择 ---------- */
const selected = new Set();
function buildChips(){
  const box = $("lessonChips");
  DATA.lessons.forEach(L => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.lesson = L.lesson;
    b.innerHTML = '<span class="no">第' + L.lesson + '课</span><span class="ct">' + L.wordCount + '词</span>';
    b.addEventListener("click", () => {
      if(selected.has(L.lesson)) selected.delete(L.lesson); else selected.add(L.lesson);
      b.classList.toggle("on", selected.has(L.lesson));
      refreshStart();
    });
    box.appendChild(b);
  });
}
function refreshStart(){
  const onlyWrong = $("wrongBtn").dataset.on === "1";
  const empty = onlyWrong ? store.wrong.length === 0 : selected.size === 0;
  $("startBtn").disabled = empty;
  $("startBtn").textContent = onlyWrong
    ? "开始 · 错题本 " + store.wrong.length + " 词"
    : "开始 · 共 " + [...selected].reduce((s, l) => s + DATA.lessons[l-1].wordCount, 0) + " 词";
}

/* ---------- 会话状态 ---------- */
let pool = [], idx = 0, correctCount = 0, sessionWrong = [], streak = 0, bestStreak = 0;
let cur = null, answered = false, hintUsed = false, forceWrong = false, advanced = false;
function advance(){
  if(advanced) return;
  advanced = true;
  idx++;
  nextWord();
}

function startSession(list){
  pool = list.slice();
  if($("optRandom").checked) shuffle(pool);
  idx = 0; correctCount = 0; sessionWrong = []; streak = 0; bestStreak = 0;
  $("setup").hidden = true; $("result").hidden = true; $("drill").hidden = false;
  nextWord();
}

function currentPool(){
  if($("wrongBtn").dataset.on === "1"){
    const set = new Set(store.wrong);
    const all = [];
    DATA.lessons.forEach(L => L.words.forEach(w => { if(set.has(wkey(w))) all.push(w); }));
    return all;
  }
  const all = [];
  DATA.lessons.forEach(L => { if(selected.has(L.lesson)) L.words.forEach(w => all.push(w)); });
  return all;
}

function nextWord(){
  if(idx >= pool.length){ showResult(); return; }
  cur = pool[idx]; answered = false; hintUsed = false; forceWrong = false; advanced = false;
  $("progress").textContent = "第 " + (idx + 1) + " / " + pool.length + " 题";
  $("streakNum").textContent = streak;
  $("posTag").textContent = cur.pos;
  $("lessonTag").textContent = "第" + cur.lesson + "课";
  $("meaningEl").textContent = cur.meaning;
  const showKanji = $("optKanji").checked && cur.writing !== cur.kana;
  $("kanjiHint").hidden = !showKanji;
  $("kanjiHint").textContent = cur.writing;
  $("ans").value = "";
  $("feedback").innerHTML = "";
  $("hintBtn").disabled = false; $("skipBtn").disabled = false;
  renderMasu();
  $("ans").focus();
}

function renderMasu(){
  const masu = $("masu");
  masu.className = "masu jp";
  masu.innerHTML = "";
  const typed = $("ans").value;
  const n = ($("optLen").checked && !answered) ? Math.max(cur.kana.length, typed.length) : Math.max(typed.length, answered ? cur.kana.length : typed.length);
  for(let i = 0; i < n; i++){
    const c = document.createElement("div");
    c.className = "cell";
    const ch = typed[i];
    if(ch !== undefined){ c.textContent = ch; c.classList.add("filled"); }
    if(answered && i < cur.kana.length && ch === cur.kana[i]) c.classList.add("hit");
    masu.appendChild(c);
  }
  if(answered) masu.classList.add(forceWrong ? "bad" : (norm($("ans").value) === norm(cur.kana) ? "ok" : "bad"));
}

function check(){
  if(answered){ advance(); return; }
  const val = $("ans").value;
  if(!norm(val)) return;
  answered = true;
  const ok = !forceWrong && norm(val) === norm(cur.kana);
  const k = wkey(cur);
  const st = store.stats[k] || (store.stats[k] = { c: 0, w: 0 });
  if(ok){
    correctCount++; streak++; bestStreak = Math.max(bestStreak, streak);
    st.c++;
    if(!hintUsed){
      const wi = store.wrong.indexOf(k);
      if(wi >= 0){ store.wrong.splice(wi, 1); }
    }
  } else {
    streak = 0; st.w++;
    if(!store.wrong.includes(k)) store.wrong.push(k);
    sessionWrong.push(cur);
  }
  saveStore();
  $("streakNum").textContent = streak;
  $("hintBtn").disabled = true; $("skipBtn").disabled = true;
  renderMasu();
  const fb = $("feedback");
  fb.innerHTML = '<div class="fb-msg ' + (ok ? "ok" : "bad") + '"></div>'
    + '<div class="reveal"><button class="say" title="发音">🔊</button>'
    + '<span class="kana jp"></span><span class="kanji jp"></span></div>'
    + (ok ? '' : '<div class="enter-tip">回车继续下一题</div>');
  fb.querySelector(".fb-msg").textContent = ok
    ? (hintUsed ? "正确（用了提示）" : "正确！") : "不对，正确答案是：";
  fb.querySelector(".kana").textContent = cur.kana;
  fb.querySelector(".kanji").textContent = cur.writing !== cur.kana ? cur.writing : "";
  fb.querySelector(".say").addEventListener("click", speak);
  speak();
  if(ok) setTimeout(advance, 900);
}

function hint(){
  if(answered) return;
  const a = cur.kana, v = $("ans").value;
  if(v.length < a.length){ $("ans").value = v + a[v.length]; hintUsed = true; renderMasu(); }
  $("ans").focus();
}

function skip(){
  if(answered) return;
  hintUsed = true;
  forceWrong = true;
  $("ans").value = cur.kana;
  check();
}

/* ---------- 发音 ---------- */
function speak(){
  if(!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(cur.writing);
  u.lang = "ja-JP"; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith("ja"));
  if(v) u.voice = v;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

/* ---------- 结果页 ---------- */
function showResult(){
  $("drill").hidden = true;
  $("result").hidden = false;
  $("scoreCorrect").textContent = correctCount;
  $("scoreTotal").textContent = pool.length;
  $("scoreStreak").textContent = bestStreak;
  const blk = $("wrongListBlock"), rows = $("wrongRows");
  rows.innerHTML = "";
  if(sessionWrong.length){
    blk.hidden = false;
    $("allRightNote").hidden = true;
    $("redoWrongBtn").disabled = false;
    sessionWrong.forEach(w => {
      const d = document.createElement("div");
      d.className = "wrow";
      d.innerHTML = '<span class="l"></span><span class="k jp"></span><span class="m"></span>';
      d.querySelector(".l").textContent = "第" + w.lesson + "课";
      d.querySelector(".k").textContent = w.kana + (w.writing !== w.kana ? "（" + w.writing + "）" : "");
      d.querySelector(".m").textContent = w.meaning;
      rows.appendChild(d);
    });
  } else {
    blk.hidden = true;
    $("allRightNote").hidden = false;
    $("redoWrongBtn").disabled = true;
  }
}

/* ---------- 事件 ---------- */
$("startBtn").addEventListener("click", () => startSession(currentPool()));
$("allBtn").addEventListener("click", () => {
  DATA.lessons.forEach(L => selected.add(L.lesson));
  document.querySelectorAll(".chip").forEach(c => c.classList.add("on"));
  refreshStart();
});
$("noneBtn").addEventListener("click", () => {
  selected.clear();
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
  refreshStart();
});
$("wrongBtn").addEventListener("click", function(){
  const on = this.dataset.on === "1";
  this.dataset.on = on ? "0" : "1";
  this.style.background = on ? "" : "var(--shu-soft)";
  this.textContent = "只练错题本（" + store.wrong.length + "）";
  refreshStart();
});
$("quitBtn").addEventListener("click", () => {
  $("drill").hidden = true; $("setup").hidden = false;
  $("wrongBtn").textContent = "只练错题本（" + store.wrong.length + "）";
  refreshStart();
});
$("hintBtn").addEventListener("click", hint);
$("clearBtn").addEventListener("click", () => { $("ans").value = ""; renderMasu(); $("ans").focus(); });
$("skipBtn").addEventListener("click", skip);
$("ans").addEventListener("input", renderMasu);
$("ans").addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  if(e.isComposing || e.keyCode === 229) return; /* IME 确认假名，不判定 */
  e.preventDefault();
  check();
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && !$("drill").hidden && document.activeElement !== $("ans")){
    e.preventDefault(); $("ans").focus(); if(answered) check();
  }
});
$("redoWrongBtn").addEventListener("click", () => startSession(shuffle(sessionWrong.slice())));
$("redoSameBtn").addEventListener("click", () => startSession(pool.slice()));
$("backBtn").addEventListener("click", () => {
  $("result").hidden = true; $("setup").hidden = false;
  $("wrongBtn").textContent = "只练错题本（" + store.wrong.length + "）";
  refreshStart();
});

buildChips();
refreshStart();
if(store.wrong.length) $("wrongBtn").textContent = "只练错题本（" + store.wrong.length + "）";
</script>
